apiVersion: v2
name: workload
description: >-
  Generic Helm chart for any Kubernetes workload: Deployment, Service,
  Ingress or Gateway API HTTPRoute, HPA and ServiceAccount. One chart for web
  apps, APIs, workers and stateful services.
type: application
version: 2.1.0
appVersion: "1.0.0"
home: https://github.com/awbx/workload-helm-chart
sources:
  - https://github.com/awbx/workload-helm-chart
keywords:
  - generic
  - universal
  - workload
  - deployment
  - microservice
  - web
  - api
  - app-template
  - gateway-api
  - httproute
  - podmonitor
  - servicemonitor
  - pod-security
maintainers:
  - name: Abdelhadi Sabani
    email: asabani.work@gmail.com
    url: https://github.com/awbx
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/awbx/workload-helm-chart
  artifacthub.io/changes: |
    - kind: added
      description: Values schema describes every value, with defaults and examples
    - kind: changed
      description: Stricter validation (port ranges, durations, percentages, required names, enums); values Kubernetes would reject now fail at install time

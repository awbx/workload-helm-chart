# A single-replica service holding a ReadWriteOnce volume, with a custom
# command. `Recreate` lets the new pod attach the volume after the old one
# releases it.
image:
  repository: docker.io/library/redis
  tag: "7.4"

service:
  port: 6379

strategy:
  type: Recreate

args: ["--appendonly", "yes"]

volumes:
  - name: data
    persistentVolumeClaim:
      claimName: redis-data
volumeMounts:
  - name: data
    mountPath: /data

# The redis image starts as root unless told otherwise; run it as its own
# user so the default `runAsNonRoot: true` admits it.
podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
